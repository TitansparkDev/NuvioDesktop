name: Build and Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.14.1)'
        required: false
        default: 'v1.14.1'
      release_title:
        description: 'Release title'
        required: false
        default: 'Nuvio Desktop Windows Release'

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Inno Setup
        shell: bash
        run: |
          choco install innosetup --no-progress -y

      - name: Download TorrServer
        shell: bash
        run: |
          mkdir -p composeApp/src/desktopMain/resources/torrserver/windows-amd64
          curl -L -o composeApp/src/desktopMain/resources/torrserver/windows-amd64/TorrServer.exe \
            https://github.com/YouROK/TorrServer/releases/latest/download/TorrServer-windows-amd64.exe

      - name: Install Microsoft WebView2 Nuget
        shell: bash
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.4078.44 -OutputDirectory nuget_packages

      - name: Download Nuvio Windows Runtime DLLs
        shell: bash
        run: |
          mkdir -p /c/nuvio-runtime
          mkdir -p /c/nuvio-python
          curl -L -o /c/Nuvio.zip https://github.com/UmbraProjects/NuvioDesktop/releases/download/v1.14/Nuvio.zip
          unzip -q -j /c/Nuvio.zip "Nuvio/*.dll" -d /c/nuvio-runtime/
          unzip -q -j /c/Nuvio.zip "Nuvio/lib/python3.14/*" -d /c/nuvio-python/ || true
          rm -f /c/nuvio-runtime/WebView2Loader.dll
          rm -f /c/nuvio-runtime/player_bridge.dll
          rm /c/Nuvio.zip

      - name: Build Windows MSI, EXE, and Distributable
        shell: bash
        run: |
          touch local.properties
          WEBVIEW2_WIN="$(cygpath -w "$(pwd)/nuget_packages/Microsoft.Web.WebView2.1.0.4078.44" | tr '\\' '/')"
          echo "Using WebView2 dir: $WEBVIEW2_WIN"
          
          # Run Gradle packaging tasks
          ./gradlew.bat :composeApp:packageReleaseMsi :composeApp:createReleaseDistributable \
            -Pnuvio.windows.libmpv.runtimeDir="C:/nuvio-runtime" \
            -Pnuvio.windows.python.libDir="C:/nuvio-python" \
            -Pnuvio.webview2.dir="$WEBVIEW2_WIN" \
            --no-configuration-cache \
            --stacktrace

          # Attempt packageReleaseExe if Inno Setup is available
          ./gradlew.bat :composeApp:packageReleaseExe \
            -Pnuvio.windows.libmpv.runtimeDir="C:/nuvio-runtime" \
            -Pnuvio.windows.python.libDir="C:/nuvio-python" \
            -Pnuvio.webview2.dir="$WEBVIEW2_WIN" \
            --no-configuration-cache \
            --stacktrace || echo "packageReleaseExe skipped or not available"

      - name: Package Standalone Portable Zip
        shell: bash
        run: |
          mkdir -p release-assets
          
          # Zip the standalone app folder containing Nuvio.exe and runtime
          if [ -d "composeApp/build/compose/binaries/main-release/app/Nuvio" ]; then
            cd composeApp/build/compose/binaries/main-release/app/Nuvio
            7z a -tzip -mx=7 "../../../../../../release-assets/Nuvio-Windows-x64-Portable.zip" *
            cd ../../../../../..
          fi

          # Collect MSI installer
          find composeApp/build/compose/binaries/main-release -name "*.msi" -exec cp {} release-assets/ \;
          
          # Collect EXE installer if created
          find composeApp/build/compose/binaries/main-release -name "*.exe" ! -name "Nuvio.exe" -exec cp {} release-assets/ \;

          echo "Release assets staged:"
          ls -la release-assets/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-windows-release
          path: release-assets/*

      - name: Determine Release Tag
        id: release_info
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            TITLE="${{ github.event.inputs.release_title }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="Nuvio Desktop Release ${TAG}"
          else
            TAG="v1.14.1"
            TITLE="Nuvio Desktop Windows Release ${TAG}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_info.outputs.tag }}
          TITLE: ${{ steps.release_info.outputs.title }}
        shell: bash
        run: |
          NOTES=$(cat << 'EOF'
          # Nuvio Desktop for Windows

          Includes:
          - **Nuvio Windows MSI Installer**: Standard Windows installer for desktop and HTPC systems.
          - **Nuvio Windows Portable (.zip)**: Standalone package containing `Nuvio.exe` (run directly without installation).

          ### Features & Improvements
          - **Dialogue Leveler (DRC)**: Dynamic Range Compression to boost quiet speech and tame explosions/loud effects (Off / Light / Medium / Strong / Max).
          - **TV Mode & Adaptive UI**: 10-foot remote / keyboard / gamepad navigation and display modes.
          - **Stream Preparation & Pre-fetching**: Rapid stream playback and next-episode buffering.
          - **Native MPV & Anime Shaders**: Hardware accelerated playback with optional VapourSynth / SVP motion interpolation.
          - **TorrServer & Torrent Streaming**: Built-in P2P and debrid streaming engine.
          EOF
          )
          
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes || true
          gh release create "$TAG" release-assets/* --title "$TITLE" --notes "$NOTES"
